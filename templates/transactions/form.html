{% extends "layout.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8 flex items-center space-x-4">
        <a href="{{ url_for('transactions.index') }}" class="text-white-custom/50 hover:text-white-custom">&larr; BACK</a>
        <h1 class="text-3xl font-bold tracking-tighter uppercase">Record Transaction</h1>
    </div>

    <div class="card">
        <form method="POST" class="space-y-6">
            <div>
                <label for="product_id">Select Product</label>
                <select id="product_id" name="product_id" required class="w-full">
                    <option value="">-- Choose a product --</option>
                    {% for product in products %}
                        <option value="{{ product.id }}">
                            {{ product.name }} (Available: {{ product.quantity }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="type">Transaction Type</label>
                    <select id="type" name="type" required class="w-full">
                        <option value="IN">PURCHASE (IN)</option>
                        <option value="OUT">SALE (OUT)</option>
                    </select>
                </div>
                <div>
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" min="1" required class="w-full">
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="btn btn-primary w-full py-3 uppercase tracking-widest font-bold">
                    SUBMIT TRANSACTION
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
