{% extends "layout.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center -mt-20">
    <div class="card w-full max-w-md">
        <h1 class="text-3xl font-bold mb-8 tracking-tighter text-center">ISMS LOGIN</h1>
        
        <form method="POST" class="space-y-6">
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="w-full" required autofocus>
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="w-full" required>
            </div>
            <button type="submit" class="btn btn-primary w-full py-3">LOG IN</button>
        </form>
    </div>
</div>
{% endblock %}
