{% extends "layout.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8 flex items-center space-x-4">
        <a href="{{ url_for('products.index') }}" class="text-white-custom/50 hover:text-white-custom">&larr; BACK</a>
        <h1 class="text-3xl font-bold tracking-tighter uppercase">
            {{ 'Edit Product' if product else 'Add New Product' }}
        </h1>
    </div>

    <div class="card">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="name">Product Name</label>
                    <input type="text" id="name" name="name" value="{{ product.name if product else '' }}" required class="w-full">
                </div>
                <div>
                    <label for="category">Category</label>
                    <input type="text" id="category" name="category" value="{{ product.category if product else '' }}" required class="w-full">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="price">Price ($)</label>
                    <input type="number" step="0.01" id="price" name="price" value="{{ product.price if product else '' }}" required class="w-full">
                </div>
                <div>
                    <label for="min_reorder_level">Min Reorder Level</label>
                    <input type="number" id="min_reorder_level" name="min_reorder_level" value="{{ product.min_reorder_level if product else '10' }}" required class="w-full">
                </div>
            </div>

            <div>
                <label for="supplier">Supplier</label>
                <input type="text" id="supplier" name="supplier" value="{{ product.supplier if product else '' }}" required class="w-full">
            </div>

            <div>
                <label for="expiry_date">Expiry Date (Optional)</label>
                <input type="date" id="expiry_date" name="expiry_date" value="{{ product.expiry_date if product else '' }}" class="w-full">
            </div>

            <div class="pt-4">
                <button type="submit" class="btn btn-primary w-full py-3 uppercase tracking-widest font-bold">
                    {{ 'Update Product' if product else 'Create Product' }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
